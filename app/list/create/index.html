<!DOCTYPE html>
<html lang="de">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="theme-color" content="#4CAF50">
    <title>KorbKumpel – Neue Liste</title>
    <link rel="icon" type="image/png" href="../../../assets/image/icon.png">
    <link rel="stylesheet" href="/app/style.css">
</head>
<body>
    <a href="/">
        <h1>KorbKumpel</h1>
    </a>
    <button class="menu-toggle" aria-label="Menü öffnen">☰</button>
    <nav class="menu">
        <a class="app" href="/app/">APP*</a>
    </nav>

    <h2>Neue Liste erstellen</h2>
    <input
        type="text"
        id="list"
        placeholder="Name der Liste"
        required
        maxlength="25"
    >
    <select id="category" required>
        <option value="weekly">Wocheneinkauf</option>
        <option value="special">Sondereinkauf</option>
        <option value="party">Partyeinkauf</option>
        <option value="holiday">Urlaubseinkauf</option>
        <option value="else">Sonstiges</option>
        <option value="">-</option>
    </select>
    <div class="checkbox-row">
        <input type="checkbox" id="acceptance" required>
        <label for="acceptance">
            Mit der Erstellung der Liste stimme ich den <a href="/information/agb/" target="_blank">AGB</a> zu.</label>
    </div>
    <button id="create_list" class="selected">Liste erstellen</button>

    <script type="module" src="script.js"></script>
</body>
</html>
