<!DOCTYPE html>
<html lang="de">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="theme-color" content="#4CAF50">
    <title>KorbKumpel – Deine Liste</title>
    <link rel="icon" type="image/png" href="../../../assets/image/icon.png">
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <a href="/">
        <h1>KorbKumpel</h1>
    </a>
    <button class="menu-toggle" aria-label="Menü öffnen">☰</button>
    <nav class="menu">
        <a class="app" href="/app/">APP*</a>
    </nav>

    <h2 id="list_title">Wird geladen ...</h2>
    <ul id="item_cont">
        <li class="list-meta">
            <span id="item_count"></span>
            <span id="list_category"></span>
        </li>
    </ul>

    <form id="added_item_form">
        <button id="edit_btn" type="button">📝</button>
        <div class="button-row">
            <button id="add_btn" type="button" class="hidden">+</button>
            <button id="sort_btn" type="button" class="hidden">A-Z</button>
        </div>
        <input id="add_inp" type="text" class="hidden" placeholder="Neuer Artikel">
    </form>

    <script type="module" src="script.js"></script>
</body>
</html>
