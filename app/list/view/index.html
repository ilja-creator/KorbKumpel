<!DOCTYPE html>
<html lang="de">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="theme-color" content="#4CAF50">
    <title>KorbKumpel – Deine Liste</title>
    <link rel="icon" type="image/png" href="/assets/image/icon.png">
    <link rel="stylesheet" href="/app/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>
    <a href="/">
        <h1>KorbKumpel</h1>
    </a>
    <button class="menu-toggle" aria-label="Menü öffnen">☰</button>
    <nav class="menu">
        <a class="app" href="/app/">APP*</a>
    </nav>

    <h2 id="list_title">Wird geladen ...</h2>
    <ul id="item_cont">
        <li class="list-meta">
            <span id="item_count"></span>
            <span id="list_category"></span>
        </li>
    </ul>

    <button id="edit_btn" type="button">📝</button>

    <div id="edit_menu" class="edit-menu">
        <form id="added_item_form">
            <div class="button-row">
                <button id="add_btn" type="button" class="hidden">+</button>
                <select id="sort_select" type="button" class="hidden">
                    <option value="1">Benutzerdefiniert</option>
                    <option value="2">A–Z</option>
                    <option value="3">Labels</option>
                    <option value="4">Labels A–Z</option>
                </select>
            </div>
            <div class="new_article hidden">
                <input id="add_inp" type="text" placeholder="Neuer Artikel">
                <input id="label_inp" type="text" placeholder="Label">
            </div>
            <button type="submit" class="hidden"></button>


            <div id="select-like" class="select-like hidden">
                <button id="toggle-menu-button" class="select-button">Reihenfolge bearbeiten ▼ </button>

                <div class="dropdown" id="dropdown">
                    <div class="item">
                        <span>Labels konnten nicht geladen werden ...</span>
                        <div class="controls">
                            <button onclick="moveUp(this)">⬆️</button>
                            <button onclick="moveDown(this)">⬇️</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
