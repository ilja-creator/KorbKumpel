<!DOCTYPE html>
<html lang="de">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="theme-color" content="#4CAF50">
    <title>KorbKumpel – Startseite</title>
    <link rel="icon" type="image/png" href="../assets/image/icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="/">
        <h1>KorbKumpel</h1>
    </a>

    <button class="menu-toggle" aria-label="Menü öffnen">☰</button>
    <nav class="menu">
        <a class="app" href="/app/">APP*</a>
        <a class="account" href="/app/account/registration/">Account</a>
    </nav>


    <h2>Dein Einkaufs-Manager</h2>
    <h2>Startseite</h2>
    <button id="new_list" class="selected">Create new list!</button>
    <button id="open_lists" class="selected">See lists (x)</button>

    <div class="hidden" id="admin-menu">
        <br><br><br>
        <hr class="admin">
        <select id="email">
            <option value="update-mail">Update-E-Mail</option>
            <option value="welcome">Welcome-E-Mail</option>
            <option value="write">Andere</option>
        </select>
        <button id="send_email" type="button" class="admin">Send selected E-Mail</button>
    </div>

    <br><br><br>
    <hr>
    <button id="to-support">Zum Support</button>

    <a href="/information/">Sie brauchen Hilfe?</a>

    <script type="module" src="script.js"></script>
</body>
</html>
